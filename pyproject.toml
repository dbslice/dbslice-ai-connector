[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbslice-ai-connector"
version = "0.0.0"
description = "Connect local datasets to a remote dbsliceAI MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Graham Pullan" }
]
dependencies = [
  "jsonschema>=4.17,<5",
  "rfc8785>=0.1,<1",
  "websockets>=14,<16"
]

[project.scripts]
dbslice-ai-connector = "dbslice_ai_connector.__main__:main"

[tool.setuptools.data-files]
"share/dbslice-ai-connector/protocol/v1" = [
  "protocol/v1/protocol.schema.json"
]

[tool.setuptools.packages.find]
where = ["src"]

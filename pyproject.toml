[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dbslice-ai-connector"
version = "0.2.0"
description = "Make a dataset on your computer available in dbsliceAI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Graham Pullan" }
]
dependencies = [
  "jsonschema>=4.17,<5",
  "rfc8785>=0.1,<1",
  "websockets>=14,<16"
]

[project.urls]
Homepage = "https://github.com/dbslice/dbslice-ai-connector"
Repository = "https://github.com/dbslice/dbslice-ai-connector"
Issues = "https://github.com/dbslice/dbslice-ai-connector/issues"

[project.scripts]
dbslice-ai-connector = "dbslice_ai_connector.__main__:cli"

[tool.setuptools.data-files]
"share/dbslice-ai-connector/protocol/v1" = [
  "protocol/v1/protocol.schema.json"
]

[tool.setuptools.packages.find]
where = ["src"]

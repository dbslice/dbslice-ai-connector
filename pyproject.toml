[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dbslice-ai-connector"
version = "0.3.0"
description = "Open-source local dataset connector for the dbsliceAI MCP analysis system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "dbsliceAI",
  "MCP",
  "simulation",
  "engineering data",
  "CFD"
]
authors = [
  { name = "Graham Pullan" }
]
dependencies = [
  "jsonschema>=4.17,<5",
  "rfc8785>=0.1,<1",
  "websockets>=14,<16"
]

[project.urls]
Homepage = "https://ai.dbslice.org/"
Repository = "https://github.com/dbslice/dbslice-ai-connector"
Issues = "https://github.com/dbslice/dbslice-ai-connector/issues"
"Dataset format" = "https://github.com/dbslice/dbslice-ai-sample-data/blob/main/DATASET_FORMAT.md"

[project.scripts]
dbslice-ai-connector = "dbslice_ai_connector.__main__:cli"

[tool.setuptools.data-files]
"share/dbslice-ai-connector/protocol/v1" = [
  "protocol/v1/protocol.schema.json"
]

[tool.setuptools.packages.find]
where = ["src"]
